[package]
name = "order_handler"
version = "0.1.0"
description = "HealthTrust order handler program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "order_handler"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
# TEST-ONLY: shrinks CLAIM_WINDOW_SECS / REFUND_TIMEOUT_SECS to seconds so the
# local test suite can exercise the timeout paths. Never deploy a build with it.
short-timeouts = []

[dependencies]
anchor-lang = "0.32.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
